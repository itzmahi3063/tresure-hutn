<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Treasure Hunt</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <!-- screens are swapped in/out by js/app.js -->
    <main id="screen-home" class="screen is-active">
      <div class="balance-pill">
        <span class="balance-pill__icon">💎</span>
        <span id="diamond-balance">0</span>
      </div>
      <!-- chest / spin / shortcuts go here, matching the reference design -->
    </main>

    <main id="screen-task" class="screen"></main>
    <main id="screen-play" class="screen"></main>
    <main id="screen-refer" class="screen"></main>
    <main id="screen-profile" class="screen"></main>
  </div>

  <nav class="bottom-nav">
    <button class="bottom-nav__item is-active" data-screen="home">Home</button>
    <button class="bottom-nav__item" data-screen="task">Task</button>
    <button class="bottom-nav__item" data-screen="play">Play</button>
    <button class="bottom-nav__item" data-screen="refer">Refer</button>
    <button class="bottom-nav__item" data-screen="profile">Profile</button>
  </nav>

  <script src="/js/app.js"></script>
</body>
</html>
